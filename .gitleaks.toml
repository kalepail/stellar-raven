# gitleaks configuration for stellar-raven-codemode.
#
# `scripts/scan-secrets.mjs` runs two scanners: its own layered heuristics and,
# when available, gitleaks. The custom layers already carry an IGNORE_GLOBS
# entry for the consistency register (see the comment there); gitleaks ran with
# no config at all, so it re-flagged the same generated hashes the custom
# scanner had deliberately excluded. That gap blocked a commit on 2026-07-28
# with 15 `generic-api-key` findings, every one of them a member content hash.
#
# This file closes the gap. It EXTENDS the upstream default ruleset — it does
# not replace it — so every built-in rule still applies everywhere else.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key (default rule, allowlisted for generated content-hash maps)"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|<]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  description = """
  eval/qa/consistency-register.json is generated by `npm run eval:qa:register`.
  Its memberContentSha256 values are SHA-256 hashes of PUBLIC eval case files,
  used to detect when a case's content drifts out of a verified consistency
  cluster. Case ids ending in "auth"/"token" (e.g. q-soroban-auth-delegation-p27)
  put a keyword immediately before a 64-hex literal, which is exactly the shape
  the generic-api-key rule looks for. These are content digests of files already
  in this repository — they grant no access to anything.
  """
  paths = ['''^eval/qa/consistency-register\.json$''']
